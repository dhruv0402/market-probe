<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1f2937" stroke-width="1" stroke-opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Seismograph Chart Visual -->
  <path d="M 100 480 Q 250 470 380 440 T 600 390 T 750 320 T 900 240 T 1100 160" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <path d="M 100 480 Q 250 470 380 440 T 600 390 T 750 320 T 900 240 T 1100 160 L 1100 550 L 100 550 Z" fill="url(#glow)"/>

  <!-- Logo Mark -->
  <circle cx="160" cy="140" r="42" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="3"/>
  <path d="M 145 140 L 155 125 L 165 155 L 175 140" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Branding -->
  <text x="220" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">Market<tspan fill="#10b981">Probe</tspan></text>
  <rect x="520" y="122" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="143" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">SAAS ENTERPRISE</text>

  <!-- Tagline & Description -->
  <text x="120" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Financial Recommendation Auditor
  </text>
  <text x="120" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">
    &amp; Real-Time Alpha Gating Engine
  </text>

  <text x="120" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Audit finfluencer tips, filter noise with Bayesian ML, and backtest NSE equity calls with sub-2ms latency.
  </text>

  <!-- Key SaaS Metrics Cards -->
  <g transform="translate(120, 470)">
    <rect x="0" y="0" width="220" height="85" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">FILTERED WIN RATE</text>
    <text x="24" y="68" font-family="sans-serif" font-size="28" font-weight="800" fill="#10b981">75.00%</text>

    <rect x="250" y="0" width="220" height="85" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="274" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">AUDITED CALLS</text>
    <text x="274" y="68" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">995 Records</text>

    <rect x="500" y="0" width="220" height="85" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="524" y="36" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">NER FAST-PATH</text>
    <text x="524" y="68" font-family="sans-serif" font-size="28" font-weight="800" fill="#38bdf8">&lt; 1.56 ms</text>
  </g>
</svg>
