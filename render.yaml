services:
  - type: web
    name: marketprobe
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: MARKETPROBE_SECRET_KEY
        generateValue: true
      - key: MARKETPROBE_DB_PATH
        value: /app/data/marketprobe.db
      - key: MARKETPROBE_MODEL_PATH
        value: /app/data/xgb_model.pkl
      - key: CORS_ORIGINS
        value: "*"
