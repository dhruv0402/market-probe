services:
  - type: web
    name: marketprobe
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: singapore
    disk:
      name: marketprobe-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: MARKETPROBE_SECRET_KEY
        generateValue: true
      - key: MARKETPROBE_DB_PATH
        value: /app/data/marketprobe.db
      - key: MARKETPROBE_MODEL_PATH
        value: /app/data/xgb_model.pkl
