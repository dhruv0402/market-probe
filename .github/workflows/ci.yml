name: MarketProbe Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Testing, Static Analysis & Validation Pipeline
  # -------------------------------------------------------------
  backend-test-and-lint:
    name: Backend Test Suite & Code Quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx starlette ruff

      - name: Ruff Code Quality & Syntax Verification
        run: |
          # Check for syntax errors or undefined names
          ruff check src/ tests/ test_e2e.py --select=E9,F63,F7,F82 --show-source

      - name: Run Pytest Validation Suite (Unit & Component Tests)
        run: |
          pytest -v tests/ --maxfail=1

      - name: Run MarketProbe Comprehensive E2E Test Suite
        run: |
          python test_e2e.py

  # -------------------------------------------------------------
  # Job 2: Frontend Build, Lint & Asset Optimization
  # -------------------------------------------------------------
  frontend-build-and-check:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Verify Production Frontend Build
        working-directory: frontend
        run: |
          npm run build

  # -------------------------------------------------------------
  # Job 3: Docker Container Build & Packaging Verification
  # -------------------------------------------------------------
  docker-build-verification:
    name: Docker Multi-Stage Container Build
    needs: [backend-test-and-lint, frontend-build-and-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: marketprobe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 4: Post-Deploy Continuous Delivery Verification (Main Only)
  # -------------------------------------------------------------
  production-health-check:
    name: Render Production Health Audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [docker-build-verification]
    runs-on: ubuntu-latest

    steps:
      - name: Await Auto-Deploy & Validate Production API
        run: |
          echo "Render auto-deploys from main. Polling health probe..."
          URL="https://marketprobe.onrender.com/api/health"
          MAX_ATTEMPTS=6
          SLEEP_SEC=20
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS: Checking $URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ MarketProbe Production API is HEALTHY (HTTP 200)!"
              exit 0
            else
              echo "Server returned HTTP $STATUS. Waiting ${SLEEP_SEC}s..."
              sleep $SLEEP_SEC
            fi
          done
          echo "⚠️ Health check timed out or service asleep on free tier (non-fatal)."
          exit 0
