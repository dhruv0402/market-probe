name: MarketProbe CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests-and-hygiene:
    name: 1. Backend Pytest & Data Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio libraries (ffmpeg + libsndfile1)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full pytest regression suite
        env:
          MARKETPROBE_SECRET_KEY: ci-ephemeral-test-secret-not-for-prod
          MARKETPROBE_ALLOW_DEMO_TOKEN: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=. pytest tests/ -v

      - name: Enforce SQLite Data Hygiene & Zero Synthetic Leaks
        run: |
          PYTHONPATH=. python -c "
          from src.quant.hygiene_supervisor import run_hygiene_audit
          report = run_hygiene_audit()
          print('Hygiene Report:', report)
          assert report.get('anomalies_remaining', 1) == 0, 'Hygiene anomalies detected!'
          assert report.get('tier_counts', {}).get('SYNTHETIC_BENCHMARK', 0) == 0, 'Synthetic rows leaked into DB!'
          "

  frontend-build:
    name: 2. Frontend React/Vite Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & build production SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-image-check:
    name: 3. Production Docker Container Build Gate
    runs-on: ubuntu-latest
    needs: [ backend-tests-and-hygiene, frontend-build ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: 4. CD — Trigger Render Production Deploy & Health Verify
    runs-on: ubuntu-latest
    needs: [ backend-tests-and-hygiene, frontend-build, docker-image-check ]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook (CI-Gated CD)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not configured yet. Add it in GitHub Settings -> Secrets and variables -> Actions to enable automatic production deploys on every green build."
            exit 0
          fi
          echo "All CI gates passed — firing Render production deploy hook..."
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered successfully."

      - name: Post-Deploy Production Health Verification
        env:
          MARKETPROBE_PROD_URL: ${{ secrets.MARKETPROBE_PROD_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$MARKETPROBE_PROD_URL" ]; then
            echo "Skipping post-deploy health poll (set MARKETPROBE_PROD_URL secret to enable)."
            exit 0
          fi
          echo "Waiting for $MARKETPROBE_PROD_URL/api/health ..."
          for i in $(seq 1 18); do
            sleep 10
            if curl -fsSL "$MARKETPROBE_PROD_URL/api/health" | grep -q '"healthy"'; then
              echo "✅ Production deployment verified healthy!"
              exit 0
            fi
            echo "Attempt $i/18: waiting for container rollout..."
          done
          echo "::warning::Health endpoint did not report healthy within 180s (Render cold build may still be finishing)."
