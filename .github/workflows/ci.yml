name: MarketProbe CI & Data Hygiene

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly Sunday 03:00 UTC automated hygiene & regression check
    - cron: '0 3 * * 0'

jobs:
  backend-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio libraries (ffmpeg + libsndfile1)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full pytest suite
        env:
          MARKETPROBE_SECRET_KEY: ci-test-secret-key-not-for-prod
          MARKETPROBE_ALLOW_DEMO_TOKEN: "true"
        run: PYTHONPATH=. pytest tests/ -v

      - name: Enforce SQLite Data Hygiene & Zero Synthetic Anomalies
        run: |
          PYTHONPATH=. python -c "
          from src.quant.hygiene_supervisor import run_hygiene_audit
          report = run_hygiene_audit()
          print('Hygiene Report:', report)
          assert report.get('anomalies_remaining', 1) == 0, 'Hygiene anomalies detected!'
          assert report.get('tier_counts', {}).get('SYNTHETIC_BENCHMARK', 0) == 0, 'Synthetic rows leaked into DB!'
          "

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build React production bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
