name: MarketProbe Daily Market-Close Data Sync

on:
  schedule:
    # 10:15 UTC = 3:45 PM IST (Monday through Friday, right after NSE close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-sync-and-hygiene:
    name: Sync Live SEC Form 4, Audit Open Calls & Verify Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Safe Scheduled Daily Sync & Hygiene Gate
        run: PYTHONPATH=. python src/ingestion/scheduled_daily_sync.py

      - name: Trigger Live Production Insider Sync (if deployed)
        env:
          MARKETPROBE_PROD_URL: ${{ secrets.MARKETPROBE_PROD_URL }}
        run: |
          if [ -n "$MARKETPROBE_PROD_URL" ]; then
            curl -fsSL -X POST "$MARKETPROBE_PROD_URL/api/insiders/sync" \
              -H "Content-Type: application/json" \
              -d '{"tickers":["AAPL","NVDA","MSFT","META","INTC","AMD"],"max_filings_per_ticker":6}' || true
            curl -fsSL "$MARKETPROBE_PROD_URL/api/system/data-health" || true
          fi

      - name: Commit & Push Verified Database Updates
        run: |
          git config --global user.name "MarketProbe Bot"
          git config --global user.email "bot@marketprobe.in"
          if git diff --quiet data/marketprobe.db; then
            echo "No database changes to commit today."
            exit 0
          fi
          git add data/marketprobe.db
          git commit -m "chore(data): scheduled SEC Form 4 sync & hygiene audit [skip ci]"
          git push origin main
