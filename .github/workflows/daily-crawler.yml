name: MarketProbe Daily Market-Close Ingestion Pipeline

on:
  schedule:
    # 10:15 UTC = 3:45 PM IST (Monday through Friday, right at market close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Ingestion Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Autonomous Daily Pipeline
      run: |
        python run_overnight_pipeline.py

    - name: Commit and Push Updated Audit Database & CSVs
      run: |
        git config --global user.name "MarketProbe Bot"
        git config --global user.email "bot@marketprobe.in"
        git add data/marketprobe.db data/*.csv frontend/public/*.csv 2>/dev/null || true
        git commit -m "chore(data): automated daily ingestion & tick audit [skip ci]" || echo "No new audited calls today."
        git push origin main || echo "Git push skipped."
