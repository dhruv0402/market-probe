services:
  marketprobe-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketprobe-engine
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENV=${ENV:-production}
      - PORT=8080
      - MARKETPROBE_SECRET_KEY=${MARKETPROBE_SECRET_KEY:?Set MARKETPROBE_SECRET_KEY in .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - MARKETPROBE_ALLOW_DEMO_TOKEN=${MARKETPROBE_ALLOW_DEMO_TOKEN:-false}
      - MARKETPROBE_DEMO_MODE=${MARKETPROBE_DEMO_MODE:-false}
      - MARKETPROBE_DB_PATH=/app/data/marketprobe.db
      - MARKETPROBE_MODEL_PATH=/app/data/xgb_model.pkl
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
