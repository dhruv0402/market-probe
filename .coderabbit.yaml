# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be rigorous, constructive, and concise. Focus on financial data accuracy, security, algorithmic robustness, and clean separation between backend FastAPI, SQLite WAL persistence, and React frontend."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    biome:
      enabled: false
    markdownlint:
      enabled: true
chat:
  auto_reply: true
path_filters:
  - "!**/*.min.js"
  - "!**/*.min.css"
  - "!**/dist/**"
  - "!**/node_modules/**"
  - "!**/.pytest_cache/**"
  - "!**/__pycache__/**"
  - "!**/*.pkl"
  - "!**/*.db"
  - "!**/*.sqlite"
  - "!**/*.csv"
  - "!**/*.pdf"
  - "!**/*.pptx"
